# ------------------------------------------------------------
# Xeals Kitty Config
# Clean baseline for Arch Installer v0.1.0
# ------------------------------------------------------------

# -----------------------------
# Font
# -----------------------------

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

# -----------------------------
# Window
# -----------------------------

background_opacity 0.95
dynamic_background_opacity yes

window_padding_width 8
single_window_margin_width 5 10 5 10

confirm_os_window_close 0

# -----------------------------
# Cursor
# -----------------------------

cursor #c678dd
cursor_shape block
cursor_blink_interval -1

# -----------------------------
# Mouse / URLs
# -----------------------------

detect_urls yes
copy_on_select no
open_url_with default

# -----------------------------
# Scrollback
# -----------------------------

scrollback_lines 10000

# -----------------------------
# Tabs
# -----------------------------

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

active_tab_background   #12151d
active_tab_foreground   #c678dd
inactive_tab_background #2a113c
inactive_tab_foreground #abb2bf
tab_bar_background      #2a113c

# -----------------------------
# Colours
# Base16 oomox-materia-dark inspired
# -----------------------------

background #12151d
foreground #abb2bf

selection_background #c678dd
selection_foreground #12151d

url_color #61afef

active_border_color   #c678dd
inactive_border_color #2a113c

# Normal colours
color0 #12151d
color1 #ff8651
color2 #a0ab69
color3 #ff7f04
color4 #85b3fe
color5 #b1005b
color6 #2a859e
color7 #abb2bf

# Bright colours
color8  #6c467d
color9  #ffa00b
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #f0cef5

# -----------------------------
# Keybindings
# -----------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0